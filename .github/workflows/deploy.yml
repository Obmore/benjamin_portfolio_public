name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Éles build: csak az élesítendő oldalak épülnek (src/content/oldalak.ts), és a build leáll,
      # ha egy élesítendő oldalon „[KÉRDÉS: …]” helyőrző maradt (vite.config.ts, helyőrző-kapu).
      # A Verify workflow és a helyi build ELES_BUILD nélkül fut, így ott a helyőrzők is zöldek.
      - name: Build
        run: npm run build
        env:
          ELES_BUILD: '1'

      # PREVIEW ONLY. Until the site is switched over from the private repository, this repository's Pages site is a preview on its own
      # address, not ottbenjamin.hu: it must not claim the production domain (no CNAME) and must stay out of search engines.
      # At the switch: delete this step, then set the custom domain in Settings -> Pages. (Umami needs no change: src/site/meres.ts
      # sends measurements from ottbenjamin.hu and www.ottbenjamin.hu only.)
      - name: Preview only - no CNAME, no sitemap, robots.txt disallows everything
        run: |
          rm -f dist/CNAME dist/sitemap.xml
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
